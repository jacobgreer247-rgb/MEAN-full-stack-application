
<h2 class="mb-3">Trip Listing</h2>

<p class="text-muted mb-4">
  Number of trips loaded: {{ trips.length }}
</p>

<div class="row g-4">

  <div class="col-12 col-lg-6" *ngFor="let trip of trips">

    <div class="card h-100 shadow-sm">

      <div class="card-body">

        <app-trip-card [trip]="trip"></app-trip-card>

      </div>

      <div class="card-footer bg-white border-0 pb-3">

        <button
          type="button"
          class="btn btn-primary"
          (click)="onEdit(trip.code)">
          Edit Trip
        </button>

      </div>

    </div>

  </div>

</div>
