
<h2 class="mb-4">Edit Trip</h2>

<div *ngIf="trip">

  <form (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input
        type="text"
        class="form-control"
        name="code"
        [value]="trip.code"
        readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input
        type="text"
        class="form-control"
        name="name"
        [(ngModel)]="trip.name"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Length</label>
      <input
        type="text"
        class="form-control"
        name="length"
        [(ngModel)]="trip.length"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input
        type="text"
        class="form-control"
        name="start"
        [(ngModel)]="trip.start"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input
        type="text"
        class="form-control"
        name="resort"
        [(ngModel)]="trip.resort"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input
        type="text"
        class="form-control"
        name="perPerson"
        [(ngModel)]="trip.perPerson"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input
        type="text"
        class="form-control"
        name="image"
        [(ngModel)]="trip.image"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        class="form-control"
        rows="4"
        name="description"
        [(ngModel)]="trip.description"
        required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Save Changes
    </button>

  </form>

</div>

<p class="mt-3" *ngIf="message">
  {{ message }}
</p>
